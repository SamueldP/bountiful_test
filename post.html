<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post | Bountiful Blossoming</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-peach: #F9E2C3;
            --coral: #ED916A;
            --navy: #053359;
            --steel: #6789B0;
            --bg-color: #FEF6F0;
        }
        
        body { margin: 0; font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--navy); overflow-x: hidden; }
        
        /* Nav */
        nav { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 40px; box-sizing: border-box; background: var(--bg-color); z-index: 10;}
        .logo { margin-top: 10px; }
        .logo img { height: 120px; object-fit: contain; filter: brightness(0); } 
        
        .nav-links { display: flex; gap: 30px; align-items: center; margin-top: 30px; }
        .nav-links a { color: var(--navy); text-decoration: none; font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; transition: opacity 0.3s; text-transform: uppercase; }
        .nav-links a:hover { opacity: 0.7; }
        
        /* Dropdown */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; top: 100%; right: 0; background-color: rgba(5, 51, 89, 0.95); min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 1; }
        .dropdown-content a { padding: 15px 20px; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; text-decoration: none;}
        .dropdown-content a:hover { background-color: var(--steel); }
        .dropdown:hover .dropdown-content { display: block; }
        
        /* Single Word Banner */
        .banner { 
            background-color: var(--coral); 
            height: 60px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 30px;
            overflow: hidden;
        }
        .word-slide { 
            font-weight: 700; 
            letter-spacing: 4px; 
            color: var(--navy);
            font-size: 1.1rem;
        }
        .word-slide:nth-child(1) { animation: cycleW1 8s infinite; }
        .word-slide:nth-child(2) { animation: cycleW2 8s infinite; }
        .word-slide:nth-child(3) { animation: cycleW3 8s infinite; }
        .word-slide:nth-child(4) { animation: cycleW4 8s infinite; }
        @keyframes cycleW1 {
            0%, 95% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; transform: translateX(0); }
        }
        @keyframes cycleW2 {
            0%, 24% { opacity: 0; transform: translateX(-10px); }
            25%, 95% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; transform: translateX(0); }
        }
        @keyframes cycleW3 {
            0%, 49% { opacity: 0; transform: translateX(-10px); }
            50%, 95% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; transform: translateX(0); }
        }
        @keyframes cycleW4 {
            0%, 74% { opacity: 0; transform: translateX(-10px); }
            75%, 95% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; transform: translateX(0); }
        }

        /* Post Container */
        .post-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 40px;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            margin-top: 40px;
            margin-bottom: 80px;
        }
        .page-title {
            text-align: center;
            font-weight: 800;
            color: var(--navy);
            margin: 0 0 30px 0;
            line-height: 1.3;
        }
        .post-body {
            line-height: 1.8;
            color: #333;
            font-size: 1.1rem;
        }
        .post-body img {
            max-width: 100%;
            height: auto !important;
            border-radius: 8px;
            margin: 20px 0;
        }
        .post-body a {
            color: var(--coral);
            text-decoration: none;
            font-weight: 600;
        }
        .post-body a:hover {
            text-decoration: underline;
        }
        .post-body blockquote {
            border-left: 4px solid var(--coral);
            padding-left: 20px;
            margin-left: 0;
            color: var(--steel);
            font-style: italic;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--steel);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: var(--coral);
        }

        @media (max-width: 900px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html"><img src="images/BOUNTIFUL.png" alt="Bountiful Blossoming Logo"></a></div>
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="testimony.html">TESTIMONIES</a>
            <a href="blog.html">HEALTH BLOG</a>
            <div class="dropdown">
                <a href="resources.html">RESOURCES ⌄</a>
                <div class="dropdown-content">
                    <a href="recipes.html">RECIPES</a>
                    <a href="aim.html">AIM</a>
                    <a href="https://www.youtube.com/" target="_blank">YOUTUBE</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="banner">
        <div class="word-slide">FAITH</div>
        <div class="word-slide">FOOD</div>
        <div class="word-slide">FAMILY</div>
        <div class="word-slide">FELLOWSHIP</div>
    </div>
    
    <div style="padding: 0 20px;">
        <div class="post-container" id="post-container">
            <div style="text-align: center; color: var(--steel); font-size: 1.2rem; padding: 40px;">
                Loading post...
            </div>
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const postId = getQueryParam('id');
        const blogType = getQueryParam('blog'); 
        const domain = blogType === 'recipes' ? 'bountifulrecipestest.blogspot.com' : 'bountiful-test.blogspot.com';
        const backUrl = blogType === 'recipes' ? 'recipes.html' : 'blog.html';
        const backText = blogType === 'recipes' ? '← Back to Recipes' : '← Back to Blog';

        function handleSinglePost(data) {
            const container = document.getElementById('post-container');
            if (!data || !data.entry) {
                container.innerHTML = '<p style="text-align:center; color: red;">Post not found.</p>';
                return;
            }
            
            const post = data.entry;
            const title = post.title.$t;
            const content = post.content ? post.content.$t : '';
            
            document.title = title + ' | Bountiful Blossoming';
            
            container.innerHTML = `
                <a href="${backUrl}" class="back-link">${backText}</a>
                <h1 class="page-title" style="letter-spacing: 2px; font-size: 2.5rem; margin-bottom: 20px;">${title}</h1>
                <div class="post-body">
                    ${content}
                </div>
            `;
        }

        if (postId) {
            const script = document.createElement('script');
            script.src = `https://${domain}/feeds/posts/default/${postId}?alt=json-in-script&callback=handleSinglePost`;
            document.body.appendChild(script);
        } else {
            document.getElementById('post-container').innerHTML = '<p style="text-align:center; color: red;">No post specified.</p>';
        }
    </script>
</body>
</html>
