<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | Bountiful Blossoming</title>
    <link rel="icon" href="images/testimonies.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-peach: #F9E2C3;
            --coral: #ED916A;
            --navy: #053359;
            --steel: #6789B0;
            --bg-color: #FEF6F0;
        }
        
        body { margin: 0; font-family: 'Montserrat', sans-serif; background-color: white; color: var(--navy); overflow-x: hidden; }
        
        /* Nav & Hero */
        .hero { position: relative; height: 100vh; background-image: url('images/DSC_1930.JPG'); background-size: cover; background-position: center; }
        nav { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 40px; box-sizing: border-box; background: transparent; z-index: 10;}
        .logo { margin-top: 10px; }
        .logo img { height: 200px; object-fit: contain; }
        
        .nav-links { display: flex; gap: 30px; align-items: center; margin-top: 20px; }
        .nav-links a { color: var(--navy); text-decoration: none; font-size: 0.9rem; font-weight: 400; letter-spacing: 2px; transition: opacity 0.3s; text-transform: uppercase; }
        .nav-links a:hover { opacity: 0.7; }
        
        /* Dropdown */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; top: 100%; right: 0; background-color: rgba(5, 51, 89, 0.95); min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 1; }
        .dropdown-content a { padding: 15px 20px; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; text-decoration: none;}
        .dropdown-content a:hover { background-color: var(--steel); }
        .dropdown:hover .dropdown-content { display: block; }
        
        .hero-title {
            position: absolute;
            top: 20%;
            left: 10%;
            font-family: 'Great Vibes', cursive;
            font-size: 7rem;
            color: var(--navy);
            line-height: 1;
            margin: 0;
        }

        /* Static Banner */
        .banner { 
            background-color: var(--coral); 
            padding: 20px 0;
            text-align: center;
            color: var(--navy);
            font-weight: 400; 
            letter-spacing: 8px; 
            font-size: 1.1rem;
        }

        /* Resources Grid */
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 80px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .resource-card {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease;
            aspect-ratio: 1;
            /* Placeholder background matching Canva's default */
            background: linear-gradient(to bottom, #7CD3F8 0%, #E2F6CD 100%);
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .resource-card:hover {
            transform: translateY(-5px);
        }
        
        /* Adding rolling hills placeholder style */
        .resource-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: #99CC33;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            z-index: 1;
        }
        .resource-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: -10%;
            width: 70%;
            height: 30%;
            background: #7CB30B;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            z-index: 2;
        }

        .resource-title {
            position: relative;
            z-index: 10;
            text-align: center;
            font-weight: 400;
            letter-spacing: 5px;
            font-size: 1.5rem;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 900px) {
            .resources-grid { grid-template-columns: repeat(2, 1fr); }
            .hero-title { font-size: 4rem; top: 30%; }
            .nav-links { display: none; }
        }
        @media (max-width: 600px) {
            .resources-grid { grid-template-columns: 1fr; }
        }
    
        /* Single Word Banner */
        .banner { 
            background-color: var(--coral); 
            height: 60px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 30px;
            overflow: hidden;
        }
        .word-slide { 
            font-weight: 400; 
            letter-spacing: 15px; 
            color: var(--navy);
            font-size: 1.1rem;
        }
        .word-slide:nth-child(1) { animation: cycleW1 3s infinite; }
        .word-slide:nth-child(2) { animation: cycleW2 3s infinite; }
        .word-slide:nth-child(3) { animation: cycleW3 3s infinite; }
        .word-slide:nth-child(4) { animation: cycleW4 3s infinite; }
        @keyframes cycleW1 {
            0%, 95% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; transform: translateX(0); }
        }
        @keyframes cycleW2 {
            0%, 24% { opacity: 0; transform: translateX(-10px); }
            25%, 95% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; transform: translateX(0); }
        }
        @keyframes cycleW3 {
            0%, 49% { opacity: 0; transform: translateX(-10px); }
            50%, 95% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; transform: translateX(0); }
        }
        @keyframes cycleW4 {
            0%, 74% { opacity: 0; transform: translateX(-10px); }
            75%, 95% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; transform: translateX(0); }
        }
        .bg-white { background-color: white; }
        .bg-cream { background-color: var(--bg-color); }
</style>
</head>
<body>
    <div class="hero">
        <nav>
            <div class="logo"><a href="index.html"><img src="images/testimonies.png" alt="Bountiful Blossoming Logo"></a></div>
            <div class="nav-links">
                <a href="index.html">HOME</a>
                <a href="testimony.html">TESTIMONIES</a>
                <a href="blog.html">HEALTH BLOG</a>
                <div class="dropdown">
                    <a href="resources.html">RESOURCES ⌄</a>
                    <div class="dropdown-content">
                        <a href="recipes.html">RECIPES</a>
                        <a href="aim.html">AIM</a>
                        <a href="https://www.youtube.com/" target="_blank">YOUTUBE</a>
                    </div>
                </div>
            </div>
        </nav>
        <h1 class="hero-title">resources</h1>
    </div>

    <div class="banner">
        <div class="word-slide">FAITH</div>
        <div class="word-slide">FOOD</div>
        <div class="word-slide">FAMILY</div>
        <div class="word-slide">FELLOWSHIP</div>
        
    </div>

    <div class="resources-grid">
        <a href="recipes.html" class="resource-card">
            <h3 class="resource-title">RECIPES</h3>
        </a>
        <a href="aim.html" class="resource-card">
            <h3 class="resource-title">AIM</h3>
        </a>
        <a href="https://www.youtube.com/" target="_blank" class="resource-card">
            <h3 class="resource-title">YOUTUBE</h3>
        </a>
    </div>
</body>
</html>
